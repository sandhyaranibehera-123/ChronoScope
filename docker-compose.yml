name: chronoscope

services:
  mysql:
    image: mysql:8.4
    container_name: chronoscope-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-chronoscope_root_secret}
      MYSQL_DATABASE: chronoscope_core
      MYSQL_USER: ${MYSQL_USER:-chronoscope_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chronoscope_app_secret}
      # read by infrastructure/docker/mysql/init/001-create-migrator.sh on first boot
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-chronoscope_migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:-chronoscope_migrator_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql/my.cnf:/etc/mysql/conf.d/chronoscope.cnf:ro
      - ./infrastructure/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-chronoscope_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chronoscope-net

  redis:
    image: redis:7-alpine
    container_name: chronoscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - chronoscope-net

  mongo:
    image: mongo:7
    container_name: chronoscope-mongo
    restart: unless-stopped
    profiles:
      - mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-chronoscope_mongo_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-chronoscope_mongo_secret}
      MONGO_INITDB_DATABASE: chronoscope_read
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    # WiredTiger cache capped at 0.5 GB -- on an 8 GB host the default ~50% grab starves everything else
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chronoscope-net

  # Profile-gated services (added per phase)

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: chronoscope-kafka
    profiles:
      - kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "chronoscope-kafka-cluster-v1"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - chronoscope-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: chronoscope-rabbitmq
    profiles:
      - rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chronoscope-net

  nats:
    image: nats:2.10-alpine
    container_name: chronoscope-nats
    profiles:
      - nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronoscope-net

  minio:
    image: minio/minio:latest
    container_name: chronoscope-minio
    profiles:
      - minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-chronoscope_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-chronoscope_minio_secret}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronoscope-net

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  kafka_data:
  rabbitmq_data:
  nats_data:
  minio_data:

networks:
  chronoscope-net:
    driver: bridge
